name: HoloSphere CPU Verification (3-Mode Isolated)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyTorch CPU, setuptools, & HoloSphere (editable)
        run: |
          python3 -m pip install --upgrade pip "setuptools>=77" numpy
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python3 -m pip install --no-build-isolation --no-deps -e .
      - name: Run 3-mode isolated -I test parity (0 bare asserts, 0 leaks)
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -I -B tests/run_all.py
          python3 -I -O -B tests/run_all.py
          python3 -I -B -W error tests/run_all.py
      - name: Run PREREG-S114 CPU preflight parity
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -I -B holosphere/benchmarks/prereg_s114_suite.py --cpu-preflight --json
      - name: Lean 4.36.0 static R13b certificate gate & optional live 51-theorem replay
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -I -B lean/verify_holosphere_lean.py --check --json
          if python3 -I -B -c "import shutil, sys; sys.exit(0 if shutil.which('lean') else 1)"; then
            python3 -I -B lean/verify_holosphere_lean.py --verify-all-lean --json
          else
            echo "::notice title=Lean 4.36.0 live replay skipped::lean binary not preinstalled on ubuntu-latest; static R13b/SHA-256 --check passed. Run 'make lean-verify' locally with lean 4.36.0."
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "### Lean 4.36.0 Verification" >> "$GITHUB_STEP_SUMMARY"
              echo "- Static R13b + SHA-256 certificate check (\`--check\`): **PASS**" >> "$GITHUB_STEP_SUMMARY"
              echo "- Live \`lean --verify-all-lean\` (5 modules, 51 theorems): **SKIPPED** (\`lean\` not installed on runner; run \`make lean-verify\` locally with \`leanprover/lean4:v4.36.0\`)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
