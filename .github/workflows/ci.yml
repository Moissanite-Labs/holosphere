name: HoloSphere CPU Verification (3-Mode Isolated)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyTorch CPU, setuptools, & HoloSphere (editable)
        run: |
          python3 -m pip install --upgrade pip "setuptools>=77" numpy
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python3 -m pip install --no-build-isolation --no-deps -e .
      - name: Verify C11 & C++17 Razor 64 B .sys ABI host conformance
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic holosphere/kernels/csrc/razor_abi_host_verify.c -o "${RUNNER_TEMP}/razor_c11_verify"
          "${RUNNER_TEMP}/razor_c11_verify"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic holosphere/kernels/csrc/razor_abi_host_verify.c -o "${RUNNER_TEMP}/razor_cpp17_verify"
          "${RUNNER_TEMP}/razor_cpp17_verify"
      - name: Run 3-mode isolated -I test parity (0 bare asserts, 0 leaks)
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -I -B tests/run_all.py
          python3 -I -O -B tests/run_all.py
          python3 -I -B -W error tests/run_all.py
      - name: Run PREREG-S114 CPU preflight parity
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -I -B holosphere/benchmarks/prereg_s114_suite.py --cpu-preflight --json
      - name: Install Lean 4.36.0 toolchain for live 51-theorem replay
        if: matrix.python-version == '3.12'
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean 4.36.0 static R13b certificate gate & live 51-theorem replay
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -I -B lean/verify_holosphere_lean.py --check --json
          if python3 -I -B -c "import shutil, sys; sys.exit(0 if shutil.which('lean') else 1)"; then
            python3 -I -B lean/verify_holosphere_lean.py --verify-all-lean --json
          elif [ "${{ matrix.python-version }}" = "3.12" ]; then
            echo "ERROR: lean binary missing on required Python 3.12 live-verification leg" >&2
            exit 1
          else
            echo "::notice title=Lean 4.36.0 live replay covered on 3.12 leg::static R13b/SHA-256 --check passed."
          fi
