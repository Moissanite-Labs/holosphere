# SPDX-License-Identifier: Apache-2.0
name: Verify HoloSphere-V4 Monarch-2 E2E Receipts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-holosphere-v4-monarch2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pure-stdlib 3-mode isolated -I receipt & tamper-refusal verification
        env:
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          for flags in "-I -B" "-I -O -B" "-I -B -W error"; do
            python3 $flags cuda/v4_monarch2/verify_holosphere_v4_monarch2.py --check --require-verdict CONFIRMED --json
            python3 $flags tests/test_holosphere_v4_monarch2_r5.py
          done

      - name: Fail-closed hygiene, symlink, leak, telemetry, bare-assert, & internal-tag check
        run: |
          set -eu
          ALL_FILES=(
            cuda/v4_monarch2/holosphere_v4_monarch2_e2e_sm86.cu
            cuda/v4_monarch2/holosphere_v4_monarch2_live_bench.cu
            cuda/v4_monarch2/holosphere_v4_monarch2_bpb_study.py
            cuda/v4_monarch2/holosphere_v4_monarch2.mk
            cuda/v4_monarch2/README_V4_MONARCH2.md
            cuda/v4_monarch2/verify_holosphere_v4_monarch2.py
            receipts/v4_monarch2/holosphere_v4_monarch2_ptxas_receipt.json
            receipts/v4_monarch2/holosphere_v4_monarch2_results.json
            tests/test_holosphere_v4_monarch2_r5.py
          )
          NON_GUARD_FILES=(
            cuda/v4_monarch2/holosphere_v4_monarch2_e2e_sm86.cu
            cuda/v4_monarch2/holosphere_v4_monarch2_live_bench.cu
            cuda/v4_monarch2/holosphere_v4_monarch2_bpb_study.py
            cuda/v4_monarch2/holosphere_v4_monarch2.mk
            cuda/v4_monarch2/README_V4_MONARCH2.md
            receipts/v4_monarch2/holosphere_v4_monarch2_ptxas_receipt.json
            receipts/v4_monarch2/holosphere_v4_monarch2_results.json
          )
          for f in "${ALL_FILES[@]}"; do
            if [ -L "$f" ] || [ ! -f "$f" ]; then
              echo "ERROR: expected regular non-symlink file missing or symlinked: $f" >&2
              exit 1
            fi
          done

          rc=0
          grep -rnEi '[/]home/|[/]Users/|hf_[A-Za-z0-9]{20}|ghp_[A-Za-z0-9]{20}|gho_[A-Za-z0-9]{20}|sk-[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16}|\b(Track[[:space:]]+S[0-9]+|EXP-Q[0-9]+|CS-[0-9]+|AUDIT-[A-Z0-9-]+|H19[a-d]?|PREREG-[A-Z0-9-]+|W1[0-9]-OBS|s157)\b' "${ALL_FILES[@]}" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "ERROR: leak, internal tag, or grep error detected (rc=$rc)" >&2
            exit 1
          fi

          rc=0
          grep -rnEi '(RAPL|NVML|nvidia-smi|\b(mJ|uJ|J)[[:space:]]*/[[:space:]]*tok|\btok(en)?s?[[:space:]]*/[[:space:]]*(m|u|k)?J\b|\b(watts?|joules?|kWh|MWh|TDP|mAh)\b)' "${NON_GUARD_FILES[@]}" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "ERROR: forbidden power/energy telemetry claim or grep error detected (rc=$rc)" >&2
            exit 1
          fi

          python3 -I -B -c '
          import ast, pathlib, sys
          for p in (
              "cuda/v4_monarch2/holosphere_v4_monarch2_bpb_study.py",
              "cuda/v4_monarch2/verify_holosphere_v4_monarch2.py",
              "tests/test_holosphere_v4_monarch2_r5.py",
          ):
              for n in ast.walk(ast.parse(pathlib.Path(p).read_text(encoding="utf-8"))):
                  if isinstance(n, ast.Assert):
                      sys.exit(f"ERROR: bare assert in {p}:{n.lineno}")
          print("HOLOSPHERE_V4_MONARCH2_HYGIENE_PASS=1")
          '
          git diff --exit-code
